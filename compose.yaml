services:
    nginx:
        image: nginx:1.29.4-alpine3.23
        container_name: yoklmn-nginx
        restart: unless-stopped
        depends_on:
            yoklmn:
                condition: service_started
        ports:
            - 80:80
            - 443:443
            - 3000:3000
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 3s
            start_period: 15s
            start_interval: 1s
            retries: 3
        volumes:
            - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - internal
    postgresql:
        container_name: yoklmn-postgresql
        image: postgres:18.1-alpine3.23
        restart: unless-stopped
        volumes:
            - "postgresql:/var/lib/postgresql"
            - "./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
        secrets:
            - postgresql-username
            - postgresql-password
            - postgresql-database
        environment:
            - PSUSER=${DB_USERNAME}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d ${DB_DATABASE} -U ${DB_USERNAME} || exit 1",
                ]
            interval: 5s
            timeout: 3s
            start_period: 30s
            start_interval: 2s
            retries: 5
        networks:
            - internal
    redis:
        image: redis:8.6.1-alpine3.23
        container_name: yoklmn-redis
        volumes:
            - redis:/data
        command: redis-server --appendonly yes --timeout 0
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            start_period: 30s
            start_interval: 2s
            retries: 5
        networks:
            - internal
    yoklmn:
        build: .
        container_name: yoklmn-website
        depends_on:
            postgresql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - internal
        env_file:
            - .env

networks:
    internal:

secrets:
    postgresql-username:
        environment: DB_USERNAME
    postgresql-password:
        environment: DB_PASSWORD
    postgresql-database:
        environment: DB_DATABASE

volumes:
    postgresql:
    redis:
